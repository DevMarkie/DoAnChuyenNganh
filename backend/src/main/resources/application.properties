# ============================================================
# APPLICATION PROPERTIES
# ============================================================

spring.application.name=Student Management System

# Database & Connection Pool (HikariCP)
# Local development uses the project's Docker MySQL service (published at 3308).
# Docker Compose overrides this with the internal `db:3306` hostname.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=SMS-HikariPool

# JPA / Hibernate Performance Tuning
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# open-in-view off: khong giu DB session khi Jackson serialize. Lazy association xu ly bang
# response DTO + batch fetch (duoi day), khong phai giu session mo ca request.
spring.jpa.open-in-view=false
# Batch Fetching to eliminate N+1 queries
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Generate statistics for monitoring (disable in production for max perf)
spring.jpa.properties.hibernate.generate_statistics=false

# Logging — reduce noise in production
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN

# JWT
# No default secret is shipped. Set JWT_SECRET (base64-encoded, >= 64 bytes) in
# production. When blank, JwtUtil generates a random ephemeral key at startup
# (tokens become invalid after each restart) so a known key is never committed.
app.jwt.secret=${JWT_SECRET:}
# Access-token lifetime, default 24h (was 7 days). Tokens are stateless: there is
# no server-side blacklist, so /api/auth/logout is client-side (drop the token)
# and a shorter lifetime bounds the window a leaked/stale token stays valid.
# Restarting with a blank JWT_SECRET also invalidates every outstanding token.
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — comma-separated allowed origin patterns (Spring allowedOriginPatterns).
# Overridable via CORS_ALLOWED_ORIGINS. Defaults cover local dev, Cloudflare
# Tunnel demo links, and GitHub Pages.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://192.168.1.130:5173,https://*.trycloudflare.com,https://*.github.io}

# Server & HTTP Compression (GZIP)
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Upload: tran kich thuoc file import Excel. Mac dinh Spring chi 1MB (roster lon co the
# vuot), dong thoi day la tran chan upload file khong lo.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:admin@sms.edu.vn}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

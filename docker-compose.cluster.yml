# ==============================================================================
# DOCKER COMPOSE OVERLAY: CLUSTER DEMO / LOAD BALANCING (3 BACKENDS)
# ==============================================================================
# Dùng file này khi cần demo chấm đồ án, kiểm thử chịu tải (stress test):
# Lệnh chạy: docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d
# ==============================================================================

x-replica-env: &replica-env
  JAVA_TOOL_OPTIONS: "-Xmx300m -XX:+UseSerialGC"
  SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/student_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-sms_app}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sms_dev_pw}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  PORT: 8080
  JWT_SECRET: "KY1L6HPEzkSRZBiJSxXIILsbKUwnCq8hxZ4sl6ZOjbPC1QNLrca/GeEebVpIHUue2zufgB0xddr68/Pjx4v6SA=="
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost:8080,http://192.168.1.130:5173"

x-replica-base: &replica-base
  image: doanchuyennganh-backend:latest
  restart: always
  environment: *replica-env
  depends_on:
    - backend_1
    - db
    - redis

services:
  backend_1:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx300m -XX:+UseSerialGC"

  backend_2:
    <<: *replica-base
    container_name: student_management_backend_2

  backend_3:
    <<: *replica-base
    container_name: student_management_backend_3

  frontend:
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx_main.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/nginx.cluster.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - backend_3

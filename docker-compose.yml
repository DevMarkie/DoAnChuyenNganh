version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: student_management_db
    restart: always
    environment:
      MYSQL_DATABASE: student_management
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

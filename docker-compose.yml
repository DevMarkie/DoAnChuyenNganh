services:
  # 1. MySQL Database Service (Optimized for RAM)
  db:
    image: mysql:8.0
    container_name: student_management_db
    restart: always
    environment:
      MYSQL_DATABASE: student_management
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_USER: ${DB_USER:-sms_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sms_dev_pw}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=150
      - --performance_schema=OFF
      - --innodb_buffer_pool_size=128M
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis Cache & Fast Locking Service
  redis:
    image: redis:7-alpine
    container_name: student_management_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Spring Boot Backend (Main Lightweight Instance)
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: doanchuyennganh-backend:latest
    container_name: student_management_backend_1
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/student_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sms_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sms_dev_pw}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PORT: 8080
      JWT_SECRET: "KY1L6HPEzkSRZBiJSxXIILsbKUwnCq8hxZ4sl6ZOjbPC1QNLrca/GeEebVpIHUue2zufgB0xddr68/Pjx4v6SA=="
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React + Nginx Reverse Proxy & Static Host
  frontend:
    image: nginx:alpine
    container_name: student_management_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
      - "8080:8080"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx_main.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_1

volumes:
  db_data:
  redis_data:
